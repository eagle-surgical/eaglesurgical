<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eagle Surgical Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#12202f}.wrap{max-width:900px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #dbe5ee;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px rgba(20,50,80,.06)}h1,h2{margin-top:0}.muted{color:#667685}.hidden{display:none!important}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid #cbd8e3;border-radius:10px;font-size:15px;background:#fff}button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#0d6efd;color:#fff}.secondary{background:#e9eef3;color:#172534}.status{margin-top:12px;padding:10px;border-radius:10px;background:#eef5ff}.preview{width:180px;height:140px;object-fit:contain;background:#f3f6f8;border-radius:12px;margin-top:10px;display:none}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.product{border:1px solid #dbe5ee;border-radius:14px;overflow:hidden;background:#fff}.product img{width:100%;height:170px;object-fit:contain;background:#f3f6f8}.body{padding:14px}.cat{font-size:12px;color:#64788a;text-transform:uppercase}.name{font-size:18px;font-weight:800;margin:5px 0}.desc{font-size:13px;color:#617181;min-height:36px}.danger{background:#fff0f0;color:#b42318;margin-top:10px;width:100%}@media(max-width:600px){.wrap{padding:12px}.panel{padding:17px}}
</style>
</head>
<body>
<div class="wrap">
<div class="panel"><h1>Eagle Surgical Admin</h1><div class="muted">Private catalogue management — login required</div></div>

<section id="loginPanel" class="panel">
<h2>Admin Login</h2>
<p class="muted">Only the authorized Supabase account can add or delete products.</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<br><button class="primary" id="loginBtn">Sign in</button>
<div id="loginStatus" class="status hidden"></div>
</section>

<section id="adminPanel" class="hidden">
<div class="panel">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>Add Product</h2><div id="userText" class="muted"></div></div><button class="secondary" id="logoutBtn">Sign out</button></div>
<label>Product image</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview" alt="Preview">
<label>Product name</label><input id="name" placeholder="e.g. Mayo Scissors">
<label>Category</label><input id="category" placeholder="e.g. Scissors">
<label>Description</label><textarea id="description" rows="5" placeholder="Product details / specifications"></textarea>
<br><br><button class="primary" id="publishBtn">Upload & Publish Product</button>
<div id="postStatus" class="status hidden"></div>
</div>

<div class="panel"><h2>Published Products</h2><div id="products" class="products"></div></div>
</section>
</div>

<script>
const SUPABASE_URL="https://evzgzixuaiotukxbqzth.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fJzCv0nONa76j3uflSPAHQ_CCVV_1cq";
const BUCKET="product-images";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function status(el,msg,error=false){el.textContent=msg;el.classList.remove("hidden");el.style.color=error?"#b42318":"#233"}
async function optimizeImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), reader=new FileReader();
    reader.onload=()=>{img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error("Image processing failed")),"image/webp",.90)};img.onerror=()=>reject(new Error("Invalid image"));img.src=reader.result};
    reader.onerror=()=>reject(new Error("Could not read image"));reader.readAsDataURL(file);
  });
}
function show(session){$("loginPanel").classList.toggle("hidden",!!session);$("adminPanel").classList.toggle("hidden",!session);if(session){$("userText").textContent=session.user.email||"Authorized admin";loadProducts()}}
async function loadProducts(){
  const box=$("products");box.innerHTML="Loading...";
  const {data,error}=await sb.from("Products").select("id,name,category,description,Img_url,Created_at").order("Created_at",{ascending:false});
  if(error){box.innerHTML="Could not load products: "+esc(error.message);return}
  if(!data.length){box.innerHTML='<div class="muted">No products published yet.</div>';return}
  box.innerHTML=data.map(p=>`<article class="product"><img src="${esc(p.Img_url)}" alt="${esc(p.name)}"><div class="body"><div class="cat">${esc(p.category||"Surgical Instruments")}</div><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||"")}</div><button class="danger" data-delete="${esc(p.id)}">Delete Product</button></div></article>`).join("");
  box.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete));
}
async function deleteProduct(id){
  if(!confirm("Delete this product from the public catalogue?"))return;
  const {data:row}=await sb.from("Products").select("Img_url").eq("id",id).maybeSingle();
  const {error}=await sb.from("Products").delete().eq("id",id);
  if(error){alert("Delete failed: "+error.message);return}
  if(row?.Img_url){try{const marker="/product-images/";const i=row.Img_url.indexOf(marker);if(i>=0){const path=decodeURIComponent(row.Img_url.slice(i+marker.length));await sb.storage.from(BUCKET).remove([path])}}catch(e){console.warn(e)}}
  loadProducts();
}
$("image").onchange=()=>{const f=$("image").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("preview").src=r.result;$("preview").style.display="block"};r.readAsDataURL(f)};
$("loginBtn").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password){status($("loginStatus"),"Email aur password enter karein.",true);return}status($("loginStatus"),"Signing in...");const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){status($("loginStatus"),error.message,true);return}show(data.session)};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();show(null)};
$("publishBtn").onclick=async()=>{
  const {data:{session}}=await sb.auth.getSession();if(!session){show(null);return}
  const file=$("image").files[0],name=$("name").value.trim(),category=$("category").value.trim(),description=$("description").value.trim();
  if(!file){status($("postStatus"),"Product picture select karein.",true);return}if(!name){status($("postStatus"),"Product name enter karein.",true);return}
  const btn=$("publishBtn");btn.disabled=true;status($("postStatus"),"Image prepare ho rahi hai...");
  try{
    const blob=await optimizeImage(file);const path=Date.now()+"-"+crypto.randomUUID()+".webp";
    status($("postStatus"),"Uploading image...");const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/webp",upsert:false});if(up.error)throw up.error;
    const publicUrl=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
    status($("postStatus"),"Product publish ho raha hai...");const ins=await sb.from("Products").insert({name,category,description,Img_url:publicUrl}).select().single();
    if(ins.error){await sb.storage.from(BUCKET).remove([path]);throw ins.error}
    status($("postStatus"),"Product publish ho gaya. Public website par show hoga.");$("image").value="";$("name").value="";$("category").value="";$("description").value="";$("preview").style.display="none";loadProducts();
  }catch(e){status($("postStatus"),e.message||"Upload failed",true)}finally{btn.disabled=false}
};
sb.auth.getSession().then(({data})=>show(data.session));
sb.auth.onAuthStateChange((_event,session)=>show(session));
</script>
</body>
</html>
