<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eagle Surgical — Private Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f8fa;color:#0a1722}
.wrap{max-width:980px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #dce6ec;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 10px 35px rgba(8,34,50,.07)}
h1,h2,h3{margin-top:0}.muted{color:#667685}.hidden{display:none!important}
input,textarea{width:100%;padding:13px;border:1px solid #ccd9e1;border-radius:10px;margin-top:7px;font:inherit}
label{display:block;margin:14px 0;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.btn{border:0;border-radius:10px;padding:13px 18px;background:#0b7fab;color:#fff;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#eaf3f7;color:#0b5e7d}.danger{background:#c83b3b}
.status{padding:11px 13px;border-radius:10px;background:#eef6f9;margin-top:12px;white-space:pre-wrap}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.product{border:1px solid #dce6ec;border-radius:14px;overflow:hidden;background:#fff}.product img{width:100%;height:180px;object-fit:contain;background:#f4f8fa}
.product .body{padding:14px}.product h3{margin:0 0 5px}.product p{color:#667685;font-size:13px;min-height:36px}
.preview{max-width:240px;max-height:180px;object-fit:contain;border:1px solid #dce6ec;border-radius:10px;margin-top:8px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f7ef;color:#167447;font-size:12px;font-weight:800}
@media(max-width:600px){.wrap{padding:12px}.panel{padding:17px}.row{display:block}.row>*{margin-bottom:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Eagle Surgical Admin</h1>
    <div class="muted">Private catalogue management — only authenticated users can publish or delete products.</div>
  </div>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <p class="muted">Use the authorized Supabase admin email and password.</p>
    <label>Email<input id="email" type="email" autocomplete="username"></label>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn" id="loginBtn">Sign in</button>
    <div id="loginStatus" class="status hidden"></div>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="panel">
      <div class="row" style="align-items:center">
        <div><h2 style="margin-bottom:4px">Add Product</h2><div id="userText" class="muted"></div></div>
        <button class="btn secondary" id="logoutBtn">Sign out</button>
      </div>
      <label>Product image
        <input id="image" type="file" accept="image/*">
      </label>
      <img id="preview" class="preview hidden" alt="Image preview">
      <label>Product name
        <input id="name" placeholder="e.g. Mayo Scissors">
      </label>
      <label>Category
        <input id="category" placeholder="e.g. Scissors">
      </label>
      <label>Description
        <textarea id="description" rows="4" placeholder="Short product description"></textarea>
      </label>
      <button class="btn" id="postBtn">Upload & Publish Product</button>
      <div id="postStatus" class="status hidden"></div>
    </div>

    <div class="panel">
      <div class="row" style="align-items:center">
        <div><h2 style="margin-bottom:4px">Published Products</h2><span id="countBadge" class="badge">0 products</span></div>
        <button class="btn secondary" id="refreshBtn">Refresh</button>
      </div>
      <div id="products" class="products" style="margin-top:15px"></div>
    </div>
  </section>
</div>

<script>
const SUPABASE_URL="https://evzgzixuaiotukxbqzth.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_fJzCv0nONa76j3uflSPAHQ_CCVV_1cq";
const BUCKET="product-images";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function status(el,msg,error=false){
  el.classList.remove("hidden"); el.textContent=msg;
  el.style.background=error?"#fff0f0":"#eef6f9";
}
function clearStatus(el){el.classList.add("hidden");el.textContent=""}

async function optimizeImage(file){
  if(!file||!file.type.startsWith("image/")) throw new Error("Select an image first.");
  if(file.type==="image/svg+xml") return file;
  const bitmap=await createImageBitmap(file);
  const max=1800,scale=Math.min(1,max/bitmap.width,max/bitmap.height);
  const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.drawImage(bitmap,0,0,w,h);bitmap.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",.88));
  if(!blob)throw new Error("Image optimization failed.");
  const base=(file.name||"product").replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9_-]/g,"-").replace(/-+/g,"-").slice(0,70)||"product";
  return new File([blob],base+"-"+Date.now()+".webp",{type:"image/webp"});
}

function imagePathFromUrl(url){
  if(!url)return "";
  const marker="/storage/v1/object/public/"+BUCKET+"/";
  const i=url.indexOf(marker);
  return i>=0?decodeURIComponent(url.slice(i+marker.length)):"";
}

async function loadProducts(){
  const box=$("products");box.innerHTML="<div class='muted'>Loading products...</div>";
  let result=await sb.from("Products").select("id,name,category,description,Img_url,Created_at").order("Created_at",{ascending:false});
  if(result.error) result=await sb.from("Products").select("id,name,category,description,Img_url");
  const {data,error}=result;
  if(error){box.innerHTML="<div class='muted'>Could not load products: "+esc(error.message)+"</div>";return;}
  $("countBadge").textContent=(data?.length||0)+" product"+((data?.length||0)===1?"":"s");
  if(!data?.length){box.innerHTML="<div class='muted'>No products published yet.</div>";return;}
  box.innerHTML=data.map(p=>`
    <article class="product">
      ${p.Img_url?`<img src="${esc(p.Img_url)}" alt="${esc(p.name)}" loading="lazy">`:""}
      <div class="body">
        <h3>${esc(p.name)}</h3>
        <div class="muted">${esc(p.category||"")}</div>
        <p>${esc(p.description||"")}</p>
        <button class="btn danger" data-delete-id="${esc(p.id)}" data-img="${esc(p.Img_url||"")}">Delete</button>
      </div>
    </article>`).join("");
}

async function requireSession(){
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session) throw new Error("Admin login required.");
  return data.session;
}

async function enterAdmin(session){
  $("loginPanel").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  $("userText").textContent=session.user.email||"Signed in";
  await loadProducts();
}

$("image").addEventListener("change",()=>{
  const file=$("image").files[0],preview=$("preview");
  if(!file){preview.classList.add("hidden");return;}
  preview.src=URL.createObjectURL(file);preview.classList.remove("hidden");
});

$("loginBtn").onclick=async()=>{
  clearStatus($("loginStatus"));
  try{
    const email=$("email").value.trim(),password=$("password").value;
    if(!email||!password)throw new Error("Enter email and password.");
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    await enterAdmin(data.session);
  }catch(e){status($("loginStatus"),"Login failed: "+e.message,true);}
};

$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("refreshBtn").onclick=loadProducts;

$("postBtn").onclick=async()=>{
  const btn=$("postBtn"),st=$("postStatus");
  try{
    btn.disabled=true;status(st,"Uploading image...");
    await requireSession();
    const raw=$("image").files[0];
    const file=await optimizeImage(raw);
    const name=$("name").value.trim(),category=$("category").value.trim(),description=$("description").value.trim();
    if(!name)throw new Error("Product name is required.");
    if(!category)throw new Error("Category is required.");

    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"-");
    const path="products/"+Date.now()+"-"+safe;
    const {error:upErr}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
    if(upErr)throw new Error("Image upload failed: "+upErr.message);

    const {data:urlData}=sb.storage.from(BUCKET).getPublicUrl(path);
    if(!urlData?.publicUrl){
      await sb.storage.from(BUCKET).remove([path]);
      throw new Error("Could not create public image URL.");
    }

    const {error:dbErr}=await sb.from("Products").insert({name,category,description,Img_url:urlData.publicUrl});
    if(dbErr){
      await sb.storage.from(BUCKET).remove([path]);
      throw new Error("Product database save failed: "+dbErr.message);
    }

    status(st,"Product published successfully. It will appear on the public catalogue.");
    $("image").value="";$("preview").src="";$("preview").classList.add("hidden");
    $("name").value="";$("category").value="";$("description").value="";
    await loadProducts();
  }catch(e){status(st,"Could not publish product: "+e.message,true)}
  finally{btn.disabled=false}
};

$("products").addEventListener("click",async e=>{
  const btn=e.target.closest("[data-delete-id]");if(!btn)return;
  if(!confirm("Delete this product from the public catalogue?"))return;
  btn.disabled=true;
  try{
    await requireSession();
    const id=btn.dataset.deleteId,img=btn.dataset.img||"";
    const {error:dbErr}=await sb.from("Products").delete().eq("id",id);
    if(dbErr)throw new Error(dbErr.message);
    const path=imagePathFromUrl(img);
    if(path)await sb.storage.from(BUCKET).remove([path]);
    await loadProducts();
  }catch(e){alert("Delete failed: "+e.message);btn.disabled=false}
});

sb.auth.onAuthStateChange(async(_event,session)=>{
  if(session) await enterAdmin(session);
});

(async()=>{
  try{
    const {data}=await sb.auth.getSession();
    if(data.session) await enterAdmin(data.session);
  }catch(e){console.error(e)}
})();
</script>
</body>
</html>
